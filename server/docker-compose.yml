services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb_password
      POSTGRES_DB: knowledgebase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d knowledgebase"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://kb:kb_password@db:5432/knowledgebase?schema=public"
      JWT_SECRET: "change-me-to-a-long-random-string"
      JWT_EXPIRES_IN: "7d"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      ANTHROPIC_MODEL: "claude-sonnet-5"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_TRANSCRIBE_MODEL: "${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}"
      PORT: "3001"
      CORS_ORIGIN: "http://localhost:5173"
    ports:
      - "3001:3001"

volumes:
  pgdata:
