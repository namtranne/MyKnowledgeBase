name: Keep Render awake

# Pings the API's health endpoint so the Render free instance doesn't spin
# down from inactivity. GitHub cron runs in UTC; */10 = roughly every 10 min
# (GitHub may delay scheduled runs under load, but this is enough to keep the
# service warm most of the time).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 \
            https://myknowledgebase.onrender.com/api/health \
            && echo " -- pinged OK"
